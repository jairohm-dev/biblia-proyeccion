# Compila la app de escritorio para Windows (.exe y .msi), macOS (.dmg, sin firmar) y Linux (.AppImage y .deb).
# Se ejecuta a mano desde la pestaña «Actions» o al publicar una etiqueta v* (por ejemplo v0.1.0).
# Los instaladores quedan como artefactos de la ejecución (y en la versión publicada, si es una etiqueta).
name: App de escritorio

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nombre: windows
          - os: macos-latest
            nombre: macos
          - os: ubuntu-22.04
            nombre: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux (WebKitGTK)
        if: matrix.nombre == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Herramienta de Tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: Compilar
        working-directory: desktop/src-tauri
        run: cargo tauri build --ci

      - uses: actions/upload-artifact@v4
        with:
          name: biblia-${{ matrix.nombre }}
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore

      - name: Publicar en Releases (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
          fail_on_unmatched_files: false
