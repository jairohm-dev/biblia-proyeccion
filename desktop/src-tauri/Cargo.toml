[package]
name = "biblia"
version = "0.1.0"
description = "Biblia · consola de proyección para la iglesia"
authors = ["Jairohm.dev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
tiny_http = "0.12"

# Ejecutable pequeño y ligero: optimizado por tamaño, sin información de depuración.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
